services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - switchyard-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  switchyard-data:
